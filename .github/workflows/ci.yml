name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Run Backend Tests
        run: npm test
        working-directory: backend

  portal:
    name: Frontend Build & SEO Audit
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://msp-benchmarks-api.vercel.app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build & Pre-render Static Pages
        run: npm run build
        working-directory: frontend

      - name: Verify SEO Standards (0 errors, 0 warnings)
        run: npm run verify:seo
        working-directory: frontend
